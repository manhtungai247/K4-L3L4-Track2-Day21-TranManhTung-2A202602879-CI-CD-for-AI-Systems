name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'tests/**.py'
      - 'params.yaml'
      - 'requirements.txt'
      - '.github/workflows/cicd.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v

  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
    env:
      AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Inspect GitHub OIDC claims (non-secret fields only)
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          query = urllib.parse.urlencode({"audience": "sts.amazonaws.com"})
          request = urllib.request.Request(
              os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&" + query,
              headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]},
          )
          token = json.load(urllib.request.urlopen(request))["value"]
          payload = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          for claim in ("iss", "aud", "sub", "repository", "ref", "event_name"):
              print(f"{claim}={claims.get(claim)}")
          PY

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}

      - name: Validate AWS credentials
        run: aws sts get-caller-identity > /dev/null

      - name: Configure DVC S3 remote
        run: dvc remote add -d --local -f labstore "s3://${ARTIFACT_BUCKET}/dvc"

      - name: Pull training and holdout data
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          python - <<'PYEOF'
          import json
          import os

          with open("outputs/report.json") as report_file:
              f1 = json.load(report_file)["f1_score"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output_file:
              output_file.write(f"f1={f1}\n")
          PYEOF

      - name: Upload model to S3
        run: |
          python - <<'PYEOF'
          import boto3
          import os
          import os.path

          boto3.client("s3").upload_file(
              "models/model.joblib",
              os.environ["ARTIFACT_BUCKET"],
              f"artifacts/candidates/{os.environ['GITHUB_SHA']}/model.joblib",
          )
          PYEOF

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json

  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check quality gate
        run: |
          python - <<'PYEOF'
          f1 = float("${{ needs.train.outputs.f1 }}")
          if f1 < 0.65:
              raise SystemExit(f"FAILED: f1_score {f1:.4f} < 0.65. Deployment blocked.")
          print(f"PASSED: f1_score {f1:.4f} >= 0.65. Deploying model.")
          PYEOF

  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    env:
      AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}

      - name: Promote quality-approved model to current
        run: aws s3 cp "s3://${ARTIFACT_BUCKET}/artifacts/candidates/${GITHUB_SHA}/model.joblib" "s3://${ARTIFACT_BUCKET}/artifacts/current/model.joblib"

      - name: Restart API through Systems Manager
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["sudo systemctl restart income-api","for attempt in $(seq 1 10); do if curl -fsS http://localhost:8080/healthz; then exit 0; fi; sleep 3; done; exit 1"]' \
            --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "${command_id}" --instance-id "${EC2_INSTANCE_ID}"
          aws ssm get-command-invocation --command-id "${command_id}" --instance-id "${EC2_INSTANCE_ID}" --query 'StandardOutputContent' --output text
